name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key (only when the repository secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KINOSTASH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KINOSTASH_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build release APKs
        env:
          KINOSTASH_KEYSTORE_PASSWORD: ${{ secrets.KINOSTASH_KEYSTORE_PASSWORD }}
          KINOSTASH_KEY_ALIAS: ${{ secrets.KINOSTASH_KEY_ALIAS }}
          KINOSTASH_KEY_PASSWORD: ${{ secrets.KINOSTASH_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kinostash-apks
          path: app/build/outputs/apk/release/*.apk
