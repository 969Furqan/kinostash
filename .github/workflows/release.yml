name: Release

# Publishes a release whenever main has a VERSION that hasn't been released yet.
# To release: bump VERSION, add notes to CHANGELOG.md, push to main.
# The app's "Check for updates" reads the latest release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is this version already released?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$V is already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.skip == 'false'

      - name: Restore signing key
        if: steps.check.outputs.skip == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.KINOSTASH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Set the KINOSTASH_KEYSTORE_BASE64 secret (and the password secrets) to publish signed releases."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KINOSTASH_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APKs
        if: steps.check.outputs.skip == 'false'
        env:
          KINOSTASH_KEYSTORE_PASSWORD: ${{ secrets.KINOSTASH_KEYSTORE_PASSWORD }}
          KINOSTASH_KEY_ALIAS: ${{ secrets.KINOSTASH_KEY_ALIAS }}
          KINOSTASH_KEY_PASSWORD: ${{ secrets.KINOSTASH_KEY_PASSWORD }}
          UPDATE_REPO: ${{ github.repository }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APKs and checksums
        if: steps.check.outputs.skip == 'false'
        env:
          V: ${{ steps.check.outputs.version }}
        run: |
          mkdir dist
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed -e 's/^app-//' -e 's/-release$//')
            cp "$f" "dist/kinostash-${V}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Release notes from CHANGELOG.md
        if: steps.check.outputs.skip == 'false'
        env:
          V: ${{ steps.check.outputs.version }}
        run: |
          awk -v v="$V" '
            /^## / { if (found) exit; if ($2 == v || $2 == "v"v) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "Kinostash $V" > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        if: steps.check.outputs.skip == 'false'
        with:
          tag_name: v${{ steps.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Kinostash ${{ steps.check.outputs.version }}
          body_path: notes.md
          files: dist/*
