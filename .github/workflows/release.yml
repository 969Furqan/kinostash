name: Release

# Push a tag like v0.3.0 to publish a release. The app's "Check for updates" reads the latest release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KINOSTASH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Set the KINOSTASH_KEYSTORE_BASE64 secret (and the password secrets) to publish signed releases."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KINOSTASH_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APKs
        env:
          KINOSTASH_KEYSTORE_PASSWORD: ${{ secrets.KINOSTASH_KEYSTORE_PASSWORD }}
          KINOSTASH_KEY_ALIAS: ${{ secrets.KINOSTASH_KEY_ALIAS }}
          KINOSTASH_KEY_PASSWORD: ${{ secrets.KINOSTASH_KEY_PASSWORD }}
          UPDATE_REPO: ${{ github.repository }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APKs and checksums
        run: |
          mkdir dist
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed -e 's/^app-//' -e 's/-release$//')
            cp "$f" "dist/kinostash-${VERSION_NAME}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION_NAME" '
            /^## / { if (found) exit; if ($2 == v || $2 == "v"v) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "Kinostash $VERSION_NAME" > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Kinostash ${{ env.VERSION_NAME }}
          body_path: notes.md
          files: dist/*
